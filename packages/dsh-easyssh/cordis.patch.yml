# dsh-easyssh bundle patch: inserts the plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base; the node half (exports ".") runs in the host
# process (mode store, /api/dsh-easyssh routes, remote_* agent tools),
# and the `dsh.client` declaration in package.json makes the browser half
# (exports "./client", served at /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: easyssh
      name: 'dsh-easyssh'
